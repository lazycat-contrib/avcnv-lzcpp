version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.media-converter.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: avcnv
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  - id: avcnv
    target: service
    service: avcnv
    source: docker.io/evilhsu/avcnv
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Media Converter
    summary: Published from GitHub Actions
