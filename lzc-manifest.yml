lzc-sdk-version: "0.1"
name: Media Converter
package: cloud.lazycat.app.media-converter
version: 1.0.0
min_os_version: 1.3.8
description: "Multi-format media converter supporting MP4, AVI, MKV, MOV, MP3, WAV, AAC, FLAC and more"
license: MIT
homepage: https://github.com/fengzeest-cpu/avcnv
author: fengzeest-cpu

application:
  subdomain: avcnv
  public_path:
    - /

  routes:
    - /=http://avcnv:5123

services:
  avcnv:
    # evilhsu/avcnv:latest
    image: registry.lazycat.cloud/czyt/evilhsu/avcnv:3a0d17fcb7539976
    environment:
      - LOG_LEVEL=INFO
    binds:
      - /lzcapp/var/uploads:/app/uploads
      - /lzcapp/var/localfiles:/app/localfiles
      - /lzcapp/var/outputs:/app/outputs

locales:
  en:
    name: "Media Converter"
    description: "Multi-format media converter supporting MP4, AVI, MKV, MOV, MP3, WAV, AAC, FLAC and more"
  zh:
    name: "媒体转换器"
    description: "支持MP4、AVI、MKV、MOV、MP3、WAV、AAC、FLAC等多种格式的媒体文件转换器"

unsupported_platforms:
  - ios
  - android
  - tvos
